<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #f8fafc;
      color: #172033;
    }

    .container {
      padding: 18px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 22px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0a66c2;
      color: white;

      font-size: 19px;
      font-weight: 800;

      box-shadow: 0 4px 10px rgba(10, 102, 194, 0.2);
    }

    .header-content h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #111827;
    }

    .header-content p {
      margin: 3px 0 0;
      font-size: 11px;
      color: #64748b;
    }

    /* Form */
    .field {
      margin-bottom: 15px;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 7px;

      font-size: 11px;
      font-weight: 700;
      color: #334155;
      letter-spacing: 0.1px;
    }

    .optional {
      font-size: 10px;
      font-weight: 500;
      color: #94a3b8;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);

      font-size: 14px;
      color: #94a3b8;

      pointer-events: none;
    }

    input,
    select {
      width: 100%;
      height: 42px;

      padding: 0 12px;

      border: 1px solid #e2e8f0;
      border-radius: 9px;

      background: #ffffff;
      color: #1e293b;

      font-family: inherit;
      font-size: 12px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input {
      padding-left: 36px;
    }

    input::placeholder {
      color: #a0aec0;
    }

    input:hover,
    select:hover {
      border-color: #cbd5e1;
    }

    input:focus,
    select:focus {
      border-color: #0a66c2;
      background: #fff;

      box-shadow:
        0 0 0 3px rgba(10, 102, 194, 0.10);
    }

    /* Search button */
    .search-btn {
      width: 100%;
      height: 43px;

      margin-top: 4px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      border: none;
      border-radius: 9px;

      background: #0a66c2;
      color: #ffffff;

      font-family: inherit;
      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 4px 10px rgba(10, 102, 194, 0.18);

      transition:
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
    }

    .search-btn:hover {
      background: #0959a8;

      box-shadow:
        0 6px 14px rgba(10, 102, 194, 0.25);
    }

    .search-btn:active {
      transform: translateY(1px);
    }

    .arrow {
      font-size: 15px;
      transition: transform 0.2s ease;
    }

    .search-btn:hover .arrow {
      transform: translateX(3px);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 5px;

      margin-top: 16px;

      font-size: 10px;
      color: #94a3b8;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;
      background: #22c55e;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="logo">in</div>

      <div class="header-content">
        <h1>LinkedIn Job Search</h1>
        <p>Find your next opportunity</p>
      </div>
    </div>


    <!-- Job Title -->
    <div class="field">
      <label for="jobTitle">
        Job title
        <span class="optional">Required</span>
      </label>

      <div class="input-wrapper">
        <span class="input-icon">⌕</span>

        <input
          type="text"
          id="jobTitle"
          placeholder="e.g. Full Stack Developer"
          autocomplete="off"
        >
      </div>
    </div>


    <!-- Country -->
    <div class="field">
      <label for="country">
        Location
        <span class="optional">Country</span>
      </label>

      <select id="country">
        <!-- Populated by countries.js -->
      </select>
    </div>


    <!-- Search -->
    <button id="searchBtn" class="search-btn">
      <span>Search jobs</span>
      <span class="arrow">→</span>
    </button>


    <!-- Footer -->
<span class="footer">
  Powered by
  <a
    href="https://www.instagram.com/hedi_chouaieb/"
    target="_blank"
    rel="noopener noreferrer"
  >Hedi</a>
</span>

  </div>


  <script src="countries.js"></script>
  <script src="popup.js"></script>

</body>
</html>
